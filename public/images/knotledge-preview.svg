<svg
  width="560"
  height="360"
  viewBox="0 0 560 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">KnoteLedge preview</title>
  <desc id="desc">A note-taking screen with AI highlight and answer panel.</desc>

  <defs>
    <filter id="shadow" x="-20" y="-20" width="620" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#09204A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="560" height="360" rx="26" fill="#F7FBFF"/>
  <rect x="0.5" y="0.5" width="559" height="359" rx="25.5" stroke="#DDE7F5"/>

  <g filter="url(#shadow)">
    <rect x="34" y="36" width="492" height="288" rx="24" fill="white"/>
    <rect x="34.5" y="36.5" width="491" height="287" rx="23.5" stroke="#DDE7F5"/>

    <!-- Toolbar -->
    <rect x="34" y="36" width="492" height="42" rx="24" fill="#FCFDFF"/>
    <path d="M34 78H526" stroke="#DDE7F5"/>
    <circle cx="62" cy="58" r="5" fill="#BFD8FF"/>
    <circle cx="82" cy="58" r="5" fill="#C9D5E8"/>
    <circle cx="102" cy="58" r="5" fill="#C9D5E8"/>
    <rect x="314" y="52" width="24" height="12" rx="6" fill="#EAF4FF"/>
    <rect x="350" y="52" width="24" height="12" rx="6" fill="#EAF4FF"/>
    <rect x="386" y="52" width="24" height="12" rx="6" fill="#EAF4FF"/>
    <rect x="422" y="52" width="24" height="12" rx="6" fill="#EAF4FF"/>
    <rect x="458" y="52" width="24" height="12" rx="6" fill="#EAF4FF"/>

    <!-- Note area -->
    <rect x="56" y="98" width="284" height="202" rx="18" fill="#FFFDF8" stroke="#E4EAF4"/>
    <text x="78" y="130" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#081B3F">光合成の仕組み</text>
    <text x="78" y="166" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#24395F">・光エネルギーを利用して、</text>

    <rect x="92" y="178" width="184" height="24" rx="8" fill="#FFF1A9"/>
    <text x="102" y="195" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="#24395F">二酸化炭素と水から酸素と</text>

    <text x="78" y="225" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#24395F">　グルコースを生成する。</text>
    <text x="78" y="254" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#24395F">・葉緑体で行われる。</text>

    <!-- Leaf diagram -->
    <ellipse cx="202" cy="281" rx="48" ry="24" transform="rotate(-26 202 281)" fill="#CFEEC3"/>
    <path d="M158 300C182 276 211 263 248 252" stroke="#69A95B" stroke-width="3" stroke-linecap="round"/>
    <path d="M192 271L181 250M209 263L226 244M214 277L241 281" stroke="#69A95B" stroke-width="2" stroke-linecap="round"/>
    <text x="124" y="286" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#24395F">光</text>
    <text x="264" y="252" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#24395F">CO₂</text>
    <text x="272" y="292" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#24395F">O₂</text>
    <text x="118" y="314" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#24395F">H₂O</text>

    <!-- AI panel -->
    <rect x="356" y="98" width="148" height="202" rx="18" fill="#F8FBFF" stroke="#DDE7F5"/>
    <text x="376" y="126" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#0C6CFF">AIの回答</text>

    <rect x="376" y="144" width="108" height="28" rx="9" fill="white" stroke="#DDE7F5"/>
    <text x="388" y="163" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#081B3F">光合成の役割は？</text>

    <text x="376" y="194" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#24395F">
      <tspan x="376" dy="0">植物が光エネルギーを</tspan>
      <tspan x="376" dy="17">利用して有機物を作り、</tspan>
      <tspan x="376" dy="17">酸素を放出する反応です。</tspan>
    </text>

    <text x="376" y="256" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#081B3F">関連ノート</text>
    <rect x="376" y="266" width="108" height="20" rx="7" fill="white" stroke="#DDE7F5"/>
    <rect x="376" y="292" width="108" height="20" rx="7" fill="white" stroke="#DDE7F5"/>
    <circle cx="386" cy="276" r="3" fill="#0C6CFF"/>
    <circle cx="386" cy="302" r="3" fill="#0C6CFF"/>
  </g>
</svg>
